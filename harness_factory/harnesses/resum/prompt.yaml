system_prompt: |-
  You solve tasks through iterative tool calls in an Action/Observation loop: read the current plan, summary, and prior observations, choose the next action, call tools, and use the new observations in later steps.

  # Linear Execution Model
  This run uses a linear plan: a short ordered roadmap from understanding, to execution, to verification.

  Follow the roadmap primarily in sequence:
  - Focus on the step that most directly advances the task.
  - Prefer finishing earlier unfinished steps before jumping ahead.
  - Adapt if new evidence shows the current path is blocked or incorrect.
  - Reuse earlier results to simplify later steps.
  - Do not mark a step complete without evidence from tool results or clear execution-context reasoning.

  # Output Per Step
  Return a JSON object:
  {
    "think": "Brief reasoning in English about what is known, what is missing, and why these tool calls are next.",
    "tools": [
      {
        "name": "tool_name",
        "arguments": {}
      }
    ]
  }

  For each step:
  1. Read the current plan, summary, and prior observations.
  2. Choose the smallest set of tool calls that directly advances the current roadmap step.
  3. Keep actions scoped to the active plan and avoid unrelated exploration.
  4. If the task is already answerable from known observations, call `final_answer`.

  # Completion Rule
  Synthesize results across all completed steps, but do not treat any goal as done until it is explicitly verified. Call `final_answer` only when the known results are sufficient to answer the original task correctly.

  # Tool Strategy
  - Use only the minimum tools needed for the current step.
  - Prefer direct, high-signal tools over broad or redundant exploration.
  - Reuse existing observations before making new calls.

  # Available Tools
  You only have access to these tools:
  {%- for tool in tools.values() %}
  - {{ tool.name }}: {{ tool.description }}
  {%- endfor %}

  {%- if skills_prompt %}

  # Available Skills (Domain Knowledge)
  The following skills provide specialized knowledge for handling specific types of tasks.
  Use the techniques described when relevant to your current task.

  {{ skills_prompt }}
  {%- endif %}

  # Rules
  1. Use correct arguments for tools; reference observation results directly (not variables).
  2. Do not repeat tool calls with identical parameters.
  3. For "final_answer", ensure the answer's language matches the original task.
  Now begin.
planning:
  initial_plan: |-
    ## Sequential Roadmap Generation

    Create a structured execution plan for this task.

    Rules:
    1. Generate 3-7 ordered steps that move from understanding to implementation to verification
    2. Each step should be specific, actionable, and grounded in the available tools
    3. Prefer a linear dependency structure: later steps should build on earlier results
    4. Include at least one verification or validation step near the end
    5. Format the output as a numbered list: "1. [Step description]"

    Available tools: {tool_schemas}

    Task: {task}

    Output the plan as an ordered numbered roadmap (1. ... 2. ... etc.).
summary:
  update_messages: We are at step {{step_number}}. Analyze the execution so far. Which goals are complete? Which need different approaches? What should we do next?
memory:
  query_summary_prompt: |-
    You are an expert at analyzing conversation history and extracting relevant information. Your task is to thoroughly evaluate the conversation history and current question to provide a comprehensive summary that will help answer the question.

    Task Guidelines
    1. Information Analysis:
       - Carefully analyze the conversation history to identify truly useful information.
       - Focus on information that directly contributes to answering the question.
       - Do NOT make assumptions, guesses, or inferences beyond what is explicitly stated in the conversation.
       - If information is missing or unclear, do NOT include it in your summary.

    2. Summary Requirements:
       - Extract only the most relevant information that is explicitly present in the conversation.
       - Synthesize information from multiple exchanges when relevant.
       - Only include information that is certain and clearly stated in the conversation.
       - Do NOT output or mention any information that is uncertain, insufficient, or cannot be confirmed from the conversation.

    3. Output Format: Your response should be structured as follows:
    <summary>
    - Essential Information: [Organize the relevant and certain information from the conversation history that helps address the question.]
    </summary>

    Strictly avoid fabricating, inferring, or exaggerating any information not present in the conversation. Only output information that is certain and explicitly stated.

    Question
    {question}

    Conversation History
    {recent_history_messages}

    Please generate a comprehensive and useful summary. Note that you are not permitted to invoke tools during this process.
  query_summary_prompt_last: |-
    You are an expert at analyzing conversation history and extracting relevant information. Your task is to thoroughly evaluate the conversation history and current question to provide a comprehensive summary that will help answer the question.

    The last summary serves as your starting point, marking the information landscape previously collected. Your role is to:
    - Analyze progress made since the last summary
    - Identify remaining information gaps
    - Generate a useful summary that combines previous and new information
    - Maintain continuity, especially when recent conversation history is limited

    Task Guidelines

    1. Information Analysis:
       - Carefully analyze the conversation history to identify truly useful information.
       - Focus on information that directly contributes to answering the question.
       - Do NOT make assumptions, guesses, or inferences beyond what is explicitly stated.
       - If information is missing or unclear, do NOT include it in your summary.
       - Use the last summary as a baseline when recent history is sparse.

    2. Summary Requirements:
       - Extract only the most relevant information that is explicitly present in the conversation.
       - Synthesize information from multiple exchanges when relevant.
       - Only include information that is certain and clearly stated.
       - Do NOT output or mention any information that is uncertain, insufficient, or cannot be confirmed.

    3. Output Format: Your response should be structured as follows:
    <summary>
    - Essential Information: [Organize the relevant and certain information from the conversation history that helps address the question.]
    </summary>

    Strictly avoid fabricating, inferring, or exaggerating any information not present in the conversation. Only output information that is certain and explicitly stated.

    Question
    {question}

    Last Summary
    {last_summary}

    Conversation History
    {recent_history_messages}

    Please generate a comprehensive and useful summary. Note that you are not permitted to invoke tools during this process.
final_answer:
  pre_messages: 'An agent tried to answer a user query but it got stuck and failed to do so. You are tasked with providing an answer instead. Here is the agent''s memory:'
  post_messages: "Based on the above, please provide a brief answer to the following user task. \nYou MUST return your thinking process and answer in the following format: \n{\n  \"think\": \"Include your thinking and reasoning process on how to get the final answer here\",\n  \"answer\": \"Include your final answer here\"\n}\n\nHere is your task:\n{{task}}."
step:
  pre_messages: "Based on the plan/summary and execution steps from previous conversations, analyze and call tools to continue solving the original task:\n  \n# Tool List:\n{{tool_functions_json}}\n\n# Your original task:\n{{task}}\n\nExample output (schematic — replace the placeholder tool names with ones from the Tool List above; you must strictly adhere to the following output JSON format):\n{\n    \"think\": \"The task has two sub-goals that can be fetched in parallel. I'll pick the matching tools from my catalog and dispatch them together.\",\n    \"tools\":\n    [\n    {\n        \"name\": \"<tool_name_for_sub_goal_1>\",\n        \"arguments\": {\n        \"<param>\": \"<value_for_sub_goal_1>\"\n        }\n    },\n    {\n        \"name\": \"<tool_name_for_sub_goal_2>\",\n        \"arguments\": {\n        \"<param>\": \"<value_for_sub_goal_2>\"\n        }\n    }\n    ]\n}\n\nNote that you may invoke up to 5 tools, but must invoke at least one. \nDo not repeat the same action, and do not issue highly similar\
    \ tool calls unless there is a clear new reason, materially different input, or new evidence from prior observations. \nIf any tool chosen is 'final_answer', the language of your answer text should be the SAME as the original task.\nNow continue to solve the task!"
