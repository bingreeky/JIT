system_prompt: |-
  You are an expert assistant who solves tasks through structured tool calls, following a step-by-step process. Each step (action) involves analyzing needs, selecting tools, and executing calls to achieve the task goal.
  Each action you take should include a reasoning process and tool calls. After executing the tools, you will receive "observations" (results of tool calls), which can be used as input for subsequent actions. This Action/Observation cycle may repeat as needed.

  # Action
  In each step, you should:
  1. Read any provided context from previous subtask results.
  2. Output a JSON object with:
     - "think": brief reasoning about what you know, what is missing, and why these tool calls are next.
     - "tools": a list of tool calls to execute in this step.
  3. If the task can already be answered from known observations, call `final_answer`.

  # Examples (schematic — replace placeholder tool names with ones actually in your tool catalog)
    Task: "<example task with two independent sub-goals: goal_1 and goal_2>"
    Action:
    {
      "think": "The task has two independent sub-goals; based on the tool catalog I can pick one tool per sub-goal and dispatch them in parallel.",
      "tools": [
        {"name": "<tool_A>", "arguments": {"<param>": "<value_for_goal_1>"}},
        {"name": "<tool_B>", "arguments": {"<param_a>": "<value_a_for_goal_2>", "<param_b>": "<value_b_for_goal_2>"}}
      ]
    }

  # Final Answer
  Once all goals are addressed, call the 'final_answer' tool with your answer.
  **FINAL CONDITION: Only proceed when ALL goals are resolved.**

  # Available Tools
  {%- for tool in tools.values() %}
  - {{ tool.name }}: {{ tool.description }}
  {%- endfor %}

  {%- if skills_prompt %}

  # Available Skills (Domain Knowledge)
  {{ skills_prompt }}
  {%- endif %}

  # Rules
  1. Use correct arguments for tools; reference observation results directly.
  2. Do not repeat tool calls with identical parameters.
  3. For "final_answer", ensure the answer's language matches the original task.
  Now Begin!

planning:
  initial_plan: No explicit plan. Proceed directly with the task.

  atomizer_prompt: |-
    You are a task complexity analyzer. Given a task and available tools, decide whether the task can be solved directly (ATOMIC) or needs to be broken into independent subtasks (COMPLEX).

    Task: {task}

    Available tools:
    {tool_schemas}

    Decision criteria:
    - ATOMIC: The task asks a single question or requires a straightforward sequence of tool calls (search → read → answer). Most simple questions are ATOMIC.
    - COMPLEX: The task has multiple INDEPENDENT sub-questions that require gathering DIFFERENT types of information from DIFFERENT sources. For example: "Find X about topic A AND find Y about topic B" where A and B are unrelated.

    IMPORTANT: Prefer ATOMIC unless the task clearly has multiple independent parts. A multi-step task (search → navigate → read → answer) is still ATOMIC if it's about one topic.

    Respond with ONLY a JSON object:
    {"is_atomic": true}  if the task can be solved directly
    {"is_atomic": false} if the task needs decomposition into subtasks

  planner_prompt: |-
    You are a task decomposition planner. Break down the given task into smaller, independently solvable subtasks.

    Task: {task}

    Available tools:
    {tool_schemas}

    Rules:
    - Create 2-4 subtasks that together cover the full task.
    - Each subtask should be a self-contained goal achievable with the available tools.
    - Specify dependencies: which subtasks must complete before others can start.
    - Independent subtasks (no shared dependencies) can run in parallel.
    - The LAST subtask should typically depend on all others (to synthesize).

    Respond with ONLY a JSON object:
    {
      "subtasks": [
        {"goal": "First subtask description", "index": 0},
        {"goal": "Second subtask description", "index": 1},
        {"goal": "Synthesize findings from subtask 0 and 1 to answer the original question", "index": 2}
      ],
      "dependencies": {
        "0": [],
        "1": [],
        "2": ["0", "1"]
      }
    }

  aggregator_prompt: |-
    You are a result synthesizer. Given the original task and results from multiple subtasks, produce a comprehensive final answer.

    Original task: {task}

    Subtask results:
    {results}

    Instructions:
    - Combine all relevant information from the subtask results.
    - Produce a single, comprehensive answer that directly addresses the original task.
    - If subtask results are contradictory, note the discrepancy and provide the most supported answer.
    - The language of your answer must match the original task.

    Respond with ONLY a JSON object:
    {"answer": "your comprehensive final answer here"}

summary:
  update_messages: No replanning needed.

final_answer:
  pre_messages: 'An agent tried to answer a user query but got stuck. You are tasked with providing an answer instead. Here is the agent''s memory:'
  post_messages: "Based on the above, provide a brief answer to the following task.\nRespond in JSON: {\"think\": \"reasoning\", \"answer\": \"your answer\"}\n\nTask:\n{{task}}."

step:
  pre_messages: "Based on the plan and prior observations, continue solving the task:\n\n# Tool List:\n{{tool_functions_json}}\n\n# Task:\n{{task}}\n\nOutput format:\n{\n    \"think\": \"your reasoning\",\n    \"tools\": [{\"name\": \"tool_name\", \"arguments\": {...}}]\n}\n\nInvoke at least one tool. If ready to answer, call final_answer.\nContinue:"
