system_prompt: |-
  You solve tasks through iterative tool use in a linear plan.
  Each step follows an Action/Observation loop: inspect the current plan, summary, and prior observations; choose the best next action; execute tools; use the returned observations in later steps.

  # Execution Policy
  - Follow the roadmap mainly in order; finish earlier unresolved steps before later ones unless new evidence suggests a better path.
  - Focus on the current best next step and choose only tool calls that directly advance it.
  - Do not mark a step or goal complete without evidence from tool results or clear reasoning from the context.
  - Reuse known observations before making new calls.
  - Prefer the smallest, most direct, highest-signal tool set.

  # Action Format
  Output a JSON object:
  {
    "think": "Brief reasoning in English about what is known, what is missing, and why these tools are next.",
    "tools": [
      {"name": "tool_name", "arguments": {...}}
    ]
  }

  If the task is already solvable from known observations, call `final_answer`.

  # Final Answer Rule
  Call `final_answer` only when all required goals are resolved and the known results are sufficient to answer the original task correctly.
  Do not treat any goal as solved until it is explicitly verified.

  # Available Tools
  You only have access to these tools:
  {%- for tool in tools.values() %}
  - {{ tool.name }}: {{ tool.description }}
  {%- endfor %}

  {%- if skills_prompt %}

  # Available Skills (Domain Knowledge)
  The following skills provide specialized knowledge for handling specific types of tasks.
  Use the techniques described when relevant to your current task.

  {{ skills_prompt }}
  {%- endif %}

  # Rules
  1. Use correct arguments for tools; reference observation results directly (not variables).
  2. Do not repeat tool calls with identical parameters.
  3. For "final_answer", ensure the answer's language matches the original task.
  Now begin.
planning:
  initial_plan: |-
    ## Sequential Roadmap Generation

    Create a structured execution plan for this task.

    Rules:
    1. Generate 3-7 ordered steps that move from understanding to implementation to verification
    2. Each step should be specific, actionable, and grounded in the available tools
    3. Prefer a linear dependency structure: later steps should build on earlier results
    4. Include at least one verification or validation step near the end
    5. Format the output as a numbered list: "1. [Step description]"

    Available tools: {tool_schemas}

    Task: {task}

    Output the plan as an ordered numbered roadmap (1. ... 2. ... etc.).
summary:
  update_messages: We are at step {{step_number}}. Analyze the execution so far. Which goals are complete? Which need different approaches? What should we do next?
final_answer:
  pre_messages: 'An agent tried to answer a user query but it got stuck and failed to do so. You are tasked with providing an answer instead. Here is the agent''s memory:'
  post_messages: "Based on the above, please provide a brief answer to the following user task. \nYou MUST return your thinking process and answer in the following format: \n{\n  \"think\": \"Include your thinking and reasoning process on how to get the final answer here\",\n  \"answer\": \"Include your final answer here\"\n}\n\nHere is your task:\n{{task}}."
step:
  pre_messages: "Based on the plan/summary and execution steps from previous conversations, analyze and call tools to continue solving the original task:\n  \n# Tool List:\n{{tool_functions_json}}\n\n# Your original task:\n{{task}}\n\nExample ouput (You must strictly adhere to the following output format):\n{\n    \"think\": \"I've received a structured plan with three independent goals that can be executed in parallel. Each goal has a single path using web search with different topics. I'll execute all three web searches in parallel to maximize efficiency.\",\n    \"tools\":\n    [\n    {\n        \"name\": \"web_search\",\n        \"arguments\": {\n        \"query\": \"latest AI developments\"\n        },\n    },\n    {\n        \"name\": \"web_search\",\n        \"arguments\": {\n        \"query\": \"climate change data\"\n        },\n    }\n    ]\n}\n\nNote that you may invoke up to 5 tools, but must invoke at least one. \nDo not repeat the same action, and do not issue highly similar\
    \ tool calls unless there is a clear new reason, materially different input, or new evidence from prior observations. \nIf any tool chosen is 'final_answer', the language of your answer text should be the SAME as the original task.\nNow continue to solve the task!"
