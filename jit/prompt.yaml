    As the "{{ expert_name }}", review the harness STRICTLY within your charter. Output your detailed thinking first, then the single-line JSON vote as the last line.

review_experts:
  - key: action_loop
    name: Action-Loop Expert
    charter: |-
        STUCK-IN-A-LOOP RISK: can the run get permanently stuck repeating the same step, phase, or action?
        - If the harness defines multiple phases/stages/modes (in action.py, planning.py, tool_policy.py, or via prompt markers), enumerate EVERY transition condition and check each phase can ALWAYS eventually exit. Red flags: a transition that requires an exact marker/keyword the model is never instructed (in prompt.yaml) to emit; a phase counter or flag that is never incremented/set on some code path; transition logic keyed on tool names that are never exposed in that phase; `should_replan` gating that can never fire; retry/replan loops without bounds that revisit the same state.
        - NO FORWARD PROGRESS (bounded but spinning): even when the loop is safely bounded by `ctx.max_steps`, check the control flow can actually ADVANCE past information gathering. Red flags: a loop that can only ever re-issue read-only/gathering calls (`search_*`, `get_*_info`, `filter_*`) with no code path or prompt instruction that ever drives it to commit results (state-changing tools such as `add_product_to_cart`/`add_coupon_to_cart`) or conclude; a step prompt that never tells the model to select/commit/finish once enough data is gathered; deduplication or repeat-detection that silently drops every new action so identical steps repeat until max_steps. Such a harness spins uselessly and returns an empty/wrong result — vote "fail".
        - A single-phase harness whose step prompt clearly drives commit-then-conclude has no such risk — say so and vote "pass".
  - key: tool_invocation
    name: Tool-Invocation Expert
    charter: |-
        TOOL INVOCATION RISK: can every needed tool actually be called — is anything unable to be invoked, mis-parsed, or never exposed?
        (a) Tools that cannot be invoked. Compare every tool name that `tool_policy.select_tools` may expose (including per-phase whitelists and filters) against the actual available tool list given below. Red flags: whitelist names that do not exist in the catalog (typos, invented or renamed tools); any step/phase where the exposed tool set can be empty; tool execution routed anywhere other than `ctx.execute_tool(name, args)`.
        (b) Tool-call parsing logic errors. The step prompt instructs the model to reply with JSON like `{"think": "...", "tools": [{"name": "...", "arguments": {...}}]}` (exact shape per prompt.yaml). Check that action.py's parser actually matches the format prompt.yaml asks for. Red flags: parser reads a different key than the prompt specifies (e.g. code reads "args" while the prompt says "arguments", or code reads "tool_calls" while the prompt says "tools"); regex/json extraction that breaks on markdown code fences or on `<think>` text the model may emit; arguments not passed through to `ctx.execute_tool` intact (dropped, stringified, or re-wrapped); a single malformed model reply crashing the loop instead of being handled and retried.
        (c) Not all needed tools exposed. Red flags: a tool the task requires that is filtered out in EVERY phase; per-phase whitelists that omit tools the task obviously needs; `final_answer` not exposed in the phase(s) where the agent is expected to conclude — if `final_answer` is unreachable, the agent can NEVER produce the final answer.
  - key: termination
    name: Termination Expert
    charter: |-
        TERMINATION RISK: does the run stop too early, or can it only end by exhausting `ctx.max_steps` instead of giving a final answer?
        - EARLY STOP: the harness forces or strongly biases `final_answer` before the task can actually be completed. Red flags: plan-completion heuristics that can trigger on the first step; answer extraction from empty memory; hard internal step caps far below what the task needs; prompt wording that pressures the model to answer immediately.
        - ANSWER ONLY AT MAX STEP / NEVER: no code path calls or handles `final_answer`, so every run drags on until `ctx.max_steps` is exhausted; prompt.yaml never tells the model when and how to call `final_answer`; a "verification" phase that loops back forever on imperfect results; the loop ignores `ctx.max_steps` entirely. Needing max_steps exhaustion to end is a defect even when a fallback answer is returned — vote "fail".
        - MAX-STEP FALLBACK: when `ctx.max_steps` IS reached, `action.run` must still return a best-effort `RunResult` with a usable `answer` (never raise, never return None/empty).
  - key: prompt_parse
    name: Prompt-Parse Expert
    charter: |-
        PROMPT PARSING RISK: can prompt.yaml be parsed and every template be rendered, or does the run crash/degrade before or during the step loop?
        - prompt.yaml must be valid YAML parsing to a mapping with the required keys (`system_prompt`, `planning`, `summary`, `final_answer`, `step`) — the deterministic static check report below is ground truth; any YAML error or missing key it reports is a concrete defect, vote "fail".
        - TEMPLATE RENDERING METHOD (crash risk): prompt.yaml templates MUST be rendered with Jinja2 (`Template(tpl).render(**vars)`), NEVER with Python `str.format(...)`, `%`-formatting, or f-strings. These templates deliberately contain literal JSON braces (e.g. the required `{"think": ..., "tools": [...]}` output-format example), and `str.format()` treats every brace pair as a replacement field — it raises `KeyError`/`ValueError` at render time and crashes the run inside `init_plan`/the step loop BEFORE step 1, before any repair is possible. Flag any `.format(` or ` % ` applied to a `self.prompts[...]` value (or to any template string containing braces) — vote "fail".
        - Every Jinja2 variable referenced in the YAML templates must actually be passed by the harness code at render time (a StrictUndefined variable that is never passed crashes the run); a variable that silently never renders and leaves literal placeholders in the prompt the model sees is also a defect.
        - The four modules must compile (trust the static report: any SyntaxError or FILE MISSING is a "fail") and define the required classes (`MemoryStrategy`, `PlanningStrategy`, `ActionStrategy`, `ToolPolicyStrategy`) with the required method signatures, otherwise the runtime cannot even load the harness.
  - key: architecture
    name: Architecture-Proportionality Expert
    charter: |-
        OVER-ENGINEERING RISK: is the harness's architecture disproportionately complex for the concrete task given below — in particular, multi-agent designs for simple problems?
        - Judge proportionality against the ACTUAL task description and tool catalog, not in the abstract. A straightforward single-goal tool-use task deserves a plain single-agent plan -> act -> answer loop.
        - Red flags (vote "fail" when the task is simple): multiple sub-agents/roles/personas coordinated inside the harness (planner-agent + executor-agent + critic-agent role-play chains, debate or voting committees, simulated multi-agent message passing); elaborate state machines with many phases where one or two would do; speculative machinery the task never needs (message buses, event queues, reflection/meta-cognition layers, self-evaluation loops that re-do finished work).
        - Why this is a defect: every extra moving part adds failure surface — more transitions that can dead-end, more prompts that can mis-render, more parsing that can break — without improving task success on a simple problem.
        - A harness that is single-agent, phase-light, and directly maps task structure to a simple loop passes, even if you can imagine a fancier design. Complexity that is genuinely required by the task (e.g. the task itself has many independent sub-goals that must each be gathered and committed) is NOT a defect — reason from the task first.
