                "Converts the step record into a message sequence."

    8. MemoryView
        Description: "The context view produced by the Memory module that can be sent directly to the model."
        Import: "from scripts.kernel.types import MemoryView"
        Notes:
            Data structure:
                self.messages: List[Message] = []
                self.metadata: Dict[str, Any] = {}

    9. Directive
        Description: "The current execution directive provided by the Planning module to the Action module."
        Import: "from scripts.kernel.types import Directive"
        Notes:
            Data structure:
                self.text: str = ""
                self.metadata: Dict[str, Any] = {}

    10. ToolSelection
        Description: "The set of tools exposed by the Tool Policy module for the current step."
        Import: "from scripts.kernel.types import ToolSelection"
        Notes:
            Data structure:
                self.tools: Dict[str, Any] = {}
                self.tool_schemas_json: str = ""
                self.skills_prompt: str = ""

    11. ToolCall
        Description: "A record of a single tool call."
        Import: "from scripts.kernel.types import ToolCall"
        Notes:
            Data structure:
                self.name: str
                self.arguments: Any
                self.id: str = ""

    12. RunResult
        Description: "The final output produced by the Action module after execution completes."
        Import: "from scripts.kernel.types import RunResult"
        Notes:
            Data structure:
                self.answer: Any = None
                self.trajectory: List[StepRecord] = []
                self.terminated_reason: str = ""
                self.metadata: Dict[str, Any] = {}

    13. RuntimeContext
        Description: "The system runtime context available to the Action module."
        Import: "from scripts.kernel.types import RuntimeContext"
        Notes:
            Data structure:
                self.memory: Any
                self.planning: Any
                self.tool_policy: Any
                self.model: Any
                self.execute_tool: Any
                self.get_tool_schemas: Any
                self.logger: Any
                self.max_steps: int
        Important:
            The Action module must access `memory`, `planning`, `tool_policy`, `model`, and `execute_tool` through `ctx`.
            Do not assume the existence of any extra fields beyond those declared in `RuntimeContext`.

    14. BaseMemory
        Import: "from scripts.kernel.protocols import BaseMemory"
    
    15. BasePlanning
        Import: "from scripts.kernel.protocols import BasePlanning"
    
    16. BaseAction
        Import: "from scripts.kernel.protocols import BaseAction"
    
    17. BaseToolPolicy
        Import: "from scripts.kernel.protocols import BaseToolPolicy"

    ### 3. Python Code (`memory.py`)
    - Class Name: `MemoryStrategy`.
    - Inheritance: Must inherit from `BaseMemory`.
    - Required Methods:
        - __init__(self, prompts=None) -> None
            "Initialize prompt bindings and internal memory state.
            Must set self.prompts = prompts or {}.
            Must initialize internal run state in __init__, including self._system_prompt, self._task, self._raw_steps, and any harness-specific memory buffers or counters needed by initialize / build_context.
            "
        - initialize(self, system_prompt: str, task: TaskInput) -> None 
            "Called once at the start of each run. Initializes the agent's memory."
        - build_context(self, plan: Optional[PlanState] = None) -> MemoryView
            "Build the working context for the next LLM call.
            Converts internal memory state into a list of messages.
            Args:
                plan: Current plan state (optional, for plan-aware memory).
            Returns:
                MemoryView with messages ready for LLM.
            "
        - update(self, step: StepRecord) -> None
            "Called after each action step completes.
            Store, compress, summarize, or fold the step into memory.
            Args:
                step: The completed step record.
            "
        - update_plan(self, plan: PlanState) -> None
            "Called when a new plan or plan update is generated. Adds the plan to memory."
        - update_summary(self, summary: SummaryState) -> None
            "Called when a summary or adaptation is generated. Adds the update or summary to memory."
        - get_all_steps(self) -> List[StepRecord] 
            "Return all raw steps (for trajectory logging)."

    ### 4. Python Code (`planning.py`)
    - Class Name: `PlanningStrategy`.
    - Inheritance: Must inherit from `BasePlanning`.
    - Required Methods:
        - __init__(self, prompts=None, summary_interval: int = 8) -> None
            "Initialize prompt bindings and planning state.
            Must set self.prompts = prompts.
            "
        - init_plan(
            self,
            task: str,
            memory_view: MemoryView,
            tool_schemas: str,
            model: Callable,
            ) -> PlanState
            "Generate initial plan at the start of a run.
            Args:
                task: Task description.
                memory_view: Current memory context.
                When constructing model input, include prior memory messages
                via memory_view.messages[1:] so the system prompt at index 0
                is excluded.
                tool_schemas: JSON string of available tool schemas.
                model: LLM callable (messages -> ChatMessage).
            Returns:
                PlanState with the generated plan.
            "
        - should_replan(self, step_number: int, step: StepRecord) -> bool
            "Decide whether replanning is needed after this step."
        - update_plan(
            self,
            task: str,
            step_number: int,
            memory_view: MemoryView,
            model: Callable,
            ) -> SummaryState
            "Update/adapt the plan based on execution progress.
            Args:
                task: Original task.
                step_number: Current step index.
                memory_view: Current memory context.
                When constructing model input, include prior memory messages
                via memory_view.messages[1:] so the system prompt at index 0
                is excluded.
                model: LLM callable.
            Returns:
                SummaryState with progress summary and updated directive.
            "
        - get_directive(self) -> Directive
            "Get the current directive for the action module."
        - get_system_planning_prompt(self) -> str
            "Return planning instructions to inject into the system prompt."

    ### 5. Python Code (`action.py`)
    - Class Name: `ActionStrategy`.
    - Inheritance: Must inherit from `BaseAction`.
    - Required Methods:
        - __init__(self, prompts=None) -> None
            "Initialize prompt bindings.
            Must set self.prompts = prompts or {}.
            Keep __init__ lightweight: do not perform model calls, tool execution, or per-run state initialization there.
            "
        - run(self, task: str, ctx: RuntimeContext) -> RunResult
            "Execute the full agent run.
            Args:
                task: Task description.
                ctx: RuntimeContext providing access to all kernel services.
            Returns:
                RunResult with final answer and trajectory.
            "

    ### 6. Python Code (`tool_policy.py`)
    - Class Name: `ToolPolicyStrategy`.
    - Inheritance: Must inherit from `BaseToolPolicy`.
    - Required Methods:
        - __init__(self, prompts=None) -> None
            "Initialize prompt bindings.
            Must set self.prompts = prompts or {}.
            Keep constructor setup lightweight and defer tool catalog and skills loading to initialize(...).
            "
        - initialize(self, tool_catalog: Dict[str, Any], enable_skills: bool = False) -> None
            "Called once with the full set of registered tools."
        - select_tools(
            self,
            task: str,
            step_number: int,
            memory_view: MemoryView,
            plan: Optional[PlanState] = None,
            ) -> ToolSelection
            "Select which tools to expose for this step."
        - get_skills_prompt(self) -> str
            "Return skill instructions to inject into the system prompt."

    #### YAML Config (`prompt.yaml`)
    - Structure: Must include keys: 'system_prompt', 'planning', 'summary', 'final_answer', 'step'.
    - **MANDATORY FORMAT**: Every single prompt field (system_prompt, planning.initial_plan, summary.update_pre_messages, etc.) MUST use the block scalar syntax `|-`.
    - **STRICT PROHIBITION**: NEVER use quotes (e.g., `step: "..."` or `step: '...'`) for any prompt fields. This is the primary cause of YAML parsing errors.
    - **CRITICAL INDENTATION**: All content under `|-` MUST be indented by exactly 4 spaces relative to the key.
    - **YAML SYNTAX GUARD**: Avoid using colons `:` within your natural language text in the YAML unless they are followed by a space AND are part of a key-value pair. If you need a colon in a sentence, ensure it's handled safely within the block scalar `|-`.
    - **MANDATORY OUTPUT STRUCTURE**: Every response from the agent MUST be a SINGLE JSON OBJECT: `{"think": "...", "tools": [...]}`.
    - Prohibit returning a list of calls like `[{...}]`.
    - Prohibit returning raw strings or prefixed text like `Action: { ... }`.
    - **VARIABLE AVAILABILITY (CODE-ALIGNED)**:
    - `system_prompt`: `{% raw %}{{tools}}{% endraw %}`, `{% raw %}{{skills_prompt}}{% endraw %}`. Keep this constraint unchanged and do not introduce other variables here.
    - `planning`: You may choose the variables yourself, but they MUST exactly match the variables passed by the planning code when it constructs the planning prompt. Prefer including the original task information and tool information in this prompt.
    - `summary`: You may choose the variables yourself, but they MUST exactly match the variables passed by the summary / replanning code when it constructs the summary prompt. Do not assume any variable is available unless the code explicitly passes it.
    - `step`: You may choose the variables yourself, but they MUST exactly match the variables passed by the action loop when it constructs the step prompt. Prefer including the original task information and tool descriptions in this prompt.
    - **CRITICAL ALIGNMENT RULE**: If you reference any variable in `planning`, `summary`, or `step`, you MUST make the generated harness code pass that variable at render time. If the code does not pass a variable, do not use it in the template.
    - **TEMPLATE INTEGRITY (DYNAMIC VARIABLES)**: 
    - All prompts in the generated YAML must be DYNAMIC JINJA2 TEMPLATES.
    - **NEVER** hardcode specific strings from the task or examples into the YAML prompt fields. The YAML must be a reusable template for the planning logic.
    - **DEFENSIVE JINJA2 (MANDATORY)**: In your generated YAML, always use the pattern `{% raw %}{{var if var is defined else 'N/A'}}{% endraw %}` for ALL variables. This prevents `UndefinedError` if the framework's internal rendering engine has a mismatch.
    - **TERMINATION RULE (HIGH PRIORITY)**: If the gathered facts in the execution trajectory (memory) are sufficient to answer the user's task, you MUST call `final_answer` immediately. DO NOT perform additional verification or reasoning if the data is already present.
    - System Prompt: Primarily defines the agent's persona.
    - **SYSTEM PROMPT MUST ENFORCE OUTPUT FORMAT**: The `system_prompt` MUST explicitly require that every agent response be a JSON object with exactly the `think` and `tools` keys.
    - **SYSTEM PROMPT MUST INCLUDE TERMINATION PROTOCOL**: The `system_prompt` MUST explicitly include and enforce the Termination Protocol defined above. This requirement is mandatory and high priority.
    - Planning Prompt: Responsible for generating the initial planning logic
    - **PLANNING PROMPT MUST REQUEST A PLAN**: The `planning` prompt MUST explicitly instruct the agent to generate an initial plan for solving the task.
    - Summary Prompt: Used to track goal progress and update the current status
    - **SUMMARY PROMPT MUST REQUEST A SUMMARY**: The `summary` prompt MUST explicitly instruct the agent to produce a summary or update.

    ## Output Format
    After reasoning, output your answer in the following format.
    1. **START** your response with a natural-language explanation of the error cause and the repair plan.
    2. **THEN**, if the `memory` module needs to be changed, output the entire `memory.py` file inside `<<<PYTHON_MEMORY>>> ... <<<END_PYTHON_MEMORY>>>`. Otherwise, omit this section.
    3. **THEN**, if the `planning` module needs to be changed, output the entire `planning.py` file inside `<<<PYTHON_PLANNING>>> ... <<<END_PYTHON_PLANNING>>>`. Otherwise, omit this section.
    4. **THEN**, if the `action` module needs to be changed, output the entire `action.py` file inside `<<<PYTHON_ACTION>>> ... <<<END_PYTHON_ACTION>>>`. Otherwise, omit this section.
    5. **THEN**, if the `tool_policy` module needs to be changed, output the entire Tool Policy Python code inside `<<<PYTHON_TOOL_POLICY>>> ... <<<END_PYTHON_TOOL_POLICY>>>`. Otherwise, omit this section.
    6. **THEN**, if the YAML configuration needs to be changed, output the entire YAML content inside `<<<YAML>>> ... <<<END_YAML>>>`. Otherwise, omit this section.


repair_user_prompt: |-
    The current task is:
    {{ task_description }}

    The relevant error code is:
    {{ error_code_description }}

    The error message is:
    {{ error_message }}

    {%- if history_mistakes %}
    Previous repair attempts and modification history:
    {{ history_mistakes }}
    {%- endif %}

    Now begin your debugging and repair process.

review_system_prompt: |-
    You are a strict pre-flight quality reviewer for modular agent harnesses. A harness consists of four Python modules (`memory.py`, `planning.py`, `action.py`, `tool_policy.py`) plus a `prompt.yaml`, and will be executed by a fixed runtime BEFORE any repair is possible, so your job is to catch defects that would make the run fail or hang.

    ## How the runtime drives the harness (ground truth)
    1. The runtime prepares the model, tools, and the four modules, calls `memory.initialize(system_prompt, task_input)`, then hands control to `action.run(task, ctx)`.
    2. `Action` calls `memory.build_context()`, then `tool_policy.select_tools(task, step_number, memory_view, plan)` to decide which tools are exposed this step, then `planning.init_plan(task, memory_view, tool_schemas_json, model)` and `memory.update_plan(plan)`.
    3. In the main loop, `Action` may consult `planning.should_replan(...)` / `planning.update_plan(...)`, builds the step prompt from `prompt.yaml` templates, calls the model, parses the JSON response (`{"think": "...", "tools": [...]}`), executes tool calls via `ctx.execute_tool(name, args)`, and writes results back via `memory.update(step)`.
    4. The run ends ONLY when the agent calls the `final_answer` tool (or the harness's own explicit termination path) or when `ctx.max_steps` is exhausted. `action.run` must always return a `RunResult` with a usable `answer`.

    ## Review dimensions (these four decide the verdict — nothing else)
    1. PHASE/STAGE TRANSITION RISK (stuck risk). If the harness defines multiple phases/stages/modes (in action.py, planning.py, tool_policy.py, or via prompt markers), enumerate every transition condition and check each phase can ALWAYS eventually exit. Red flags: a transition that requires an exact marker/keyword the model is never instructed (in prompt.yaml) to emit; a phase counter or flag that is never incremented/set on some code path; transition logic keyed on tool names that are never exposed in that phase; `should_replan` gating that can never fire. A single-phase harness has no such risk — say so.
    2. TOOL ACCESSIBILITY RISK (cannot operate / cannot finish). Compare every tool name that `tool_policy.select_tools` may expose (including per-phase whitelists and filters) against the actual available tool list given below. Red flags: any step/phase where the exposed tool set can be empty; whitelist names that do not exist in the catalog (typos, wrong names); a required task tool that is filtered out in every phase; `final_answer` not exposed in the phase(s) where the agent is expected to conclude — if `final_answer` is unreachable, the agent can NEVER produce the final answer.
    3. TERMINATION RISK (early stop / never stop). Early stop: the harness forces or strongly biases `final_answer` before the task can actually be completed (e.g. plan-completion heuristics that trigger on the first step, answer extraction from empty memory). Never stop: no code path calls/handles `final_answer`; the loop ignores `ctx.max_steps`; retry/replan loops without bounds; a "verification" phase that loops back forever on imperfect results. NO FORWARD PROGRESS (bounded but dead-ends): even when the loop is safely bounded by `ctx.max_steps`, verify the control flow can actually REACH the actions that COMPLETE the task — both the state-changing/committing tools the task requires (for shopping: `add_product_to_cart`/`add_coupon_to_cart`) AND `final_answer`. Red flags: a loop that can only ever re-issue read-only/gathering calls (`search_*`, `get_*_info`, `filter_*`) with no code path or prompt instruction that ever drives it to commit results or conclude; a step prompt that never tells the model to select/commit/finish once enough data is gathered; sub-goal findings that are computed but never written into the cart/answer. Such a harness spins uselessly until max_steps and returns an empty/wrong result — rate this "high". Check that when max_steps is reached the harness still returns a best-effort RunResult.
    4. SYNTAX ERRORS (and template-rendering crashes). Python syntax in all four modules (a deterministic compile report is provided below — trust it), `prompt.yaml` must be valid YAML using block scalars. TEMPLATE RENDERING METHOD (crash risk): prompt.yaml templates MUST be rendered with Jinja2 (`Template(tpl).render(**vars)`), NEVER with Python `str.format(...)`, `%`-formatting, or f-strings. These templates deliberately contain literal JSON braces (e.g. the required `{"think": ..., "tools": [...]}` output-format example), and `str.format()` treats every `{...}` as a replacement field — it raises `KeyError`/`ValueError` at render time (e.g. `KeyError` on the `{"id": ...}` example) and crashes the run inside `init_plan`/the step loop BEFORE step 1, before any repair is possible. Flag any `.format(` or ` % ` applied to a `self.prompts[...]` value (or to any template string that contains `{` or `}`) as "high". Also, every Jinja2 variable referenced in the YAML templates must actually be passed by the harness code at render time (a variable rendered with StrictUndefined that is never passed will crash the run). Also check that the required classes (`MemoryStrategy`, `PlanningStrategy`, `ActionStrategy`, `ToolPolicyStrategy`) and required methods exist with the right signatures.

    ## Output format (MANDATORY)
    First, output your detailed review thinking: a short analysis for EACH of the four dimensions, quoting the specific code/template lines that create or rule out each risk.
    Then output, as the VERY LAST line of your response, a single-line JSON object and nothing after it:
    {"phase_transition_risk": "none|low|high", "tool_access_risk": "none|low|high", "termination_risk": "none|low|high", "syntax_risk": "none|low|high", "qualified": true}
    STRICT VERDICT RULE: "qualified" is true ONLY when ALL FOUR dimensions are "none". If ANY dimension is "low" or "high", you MUST set "qualified" to false — the harness will be regenerated. Calibrate the ratings accordingly: rate "none" when you find no concrete defect mechanism at all; rate "low" for a real defect that degrades the run without crashing it (e.g. a prompt template whose variables never render, leaving literal placeholders); rate "high" for a defect that would break, hang, or dead-end the run. Styles you dislike or hypothetical concerns without a concrete mechanism are NOT defects — do not rate them "low"; only concrete failure mechanisms count.

